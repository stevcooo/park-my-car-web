plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.carbluetooth'
version = '0.1.0'

android {
  namespace "expo.modules.carbluetooth"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The receiver posts through expo-notifications so the stop action and the
  // JS response listener keep working.
  implementation project(':expo-notifications')
}
